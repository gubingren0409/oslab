module: kernel/process
owns:
- src/kernel/proc/proc.c
- src/kernel/proc/swtch.S
- src/kernel/proc/type.h
- src/kernel/proc/method.h
state:
  proc_list: NPROC个进程槽；UNUSED、EMBRYO、SLEEPING、RUNNABLE、RUNNING、ZOMBIE状态由各自proc.lock保护。
  proc_t: 包含lock、state、pid、parent、exit_code、sleep_space、kstack、pgtbl、trapframe、heap_top、ustack_npage、mmap、context、name。
  cpus: 每hart的cpu_t含当前proc、scheduler上下文、noff中断关闭嵌套数和intena最外层关闭前的使能状态。
  context_t: 按ra、sp、s0至s11顺序存放14个uint64，与swtch的保存恢复布局一致。
  user_trapframe_t: 36个uint64依次为kernel_satp、kernel_sp、kernel_trap、epc、kernel_hartid、ra、sp、gp、tp、t0、t1、t2、s0、s1、a0至a7、s2至s11、t3至t6；与trampoline偏移一致。
  pid_lock: 保护单调分配的pid，首个pid为1。
  wait_lock: 保护parent关系和wait检查条件至睡眠的同步；其锁序早于任意进程锁。
  proczero: 首进程及孤儿收养者；正常实验流程持续运行并回收子进程，若死亡则保留ZOMBIE槽直到重启。
rules:
- 一个进程至多在一个hart上RUNNING；每个进程槽拥有独立的一页内核栈及相邻不可访问的guard page。
- EMBRYO尚不可调度；地址空间、trapframe、父子关系完整后才能发布为RUNNABLE。
- 需要同时持有wait_lock和进程锁时，必须先获取wait_lock；不得持进程锁等待wait_lock。
- scheduler与被调度进程跨swtch交接同一进程锁；重新运行的进程按当前hart恢复中断记账，不假定仍在原hart。
- cpus.noff/intena由lock模块维护；proc_init不得在已有中断嵌套或持锁期间清零它们。
- 进程退出只发布ZOMBIE；wait负责释放用户页、页表页、trapframe和mmap节点，内核栈保留给进程槽复用。
functions:
  'void proc_init(void);':
    pre:
      - 单次共享初始化，尚无调度。
    effects:
      - 初始化进程表、pid_lock、wait_lock；pid从1开始，不重置CPU的中断嵌套。
    post:
      - 所有槽UNUSED且内核栈地址按槽固定。
  'pgtbl_t proc_pgtbl_init(uint64 trapframe);':
    pre:
      - trapframe为独占用户池物理页。
    effects:
      - 建立根页及无U的trampoline RX、trapframe RW映射。
    post:
      - 成功返回根；失败只回收临时页表，返回NULL。
  'proc_t *proc_alloc(void);':
    effects:
      - 锁定UNUSED槽，改为EMBRYO，分配pid、trapframe、页表和首次上下文。
    post:
      - 成功带进程锁返回；OOM回收临时资源并解锁返回NULL。
  'void proc_free(proc_t *p);':
    pre:
      - 持有进程锁且该进程不再运行，父子关系变更受wait_lock保护。
    effects:
      - 销毁用户页表、用户页、trapframe和mmap节点，清理状态。
    post:
      - 槽变回UNUSED，固定内核栈保留供复用。
  'void proc_make_first(void);':
    pre:
      - 启动hart单次调用，进程表和页表已就绪。
    effects:
      - 构造pid1代码及栈，发布proczero和完整PCB，置为RUNNABLE。
    post:
      - 返回到main，之后由scheduler首次调度；失败清理后报告必要启动失败。
  'void proc_return(void) __attribute__((noreturn));':
    pre:
      - 首次调度时当前进程锁跨swtch交接。
    effects:
      - 释放当前进程锁并进入trap_user_return。
    post:
      - 不返回，进入U-mode。
  'int proc_fork(void);':
    pre:
      - 当前进程RUNNING。
    effects:
      - 创建EMBRYO槽，独立复制用户页、trapframe和mmap节点；子a0为0；按wait_lock再进程锁顺序发布父子关系及RUNNABLE。
    post:
      - 父返回子pid；失败-1且不泄漏、不发布半成品。
  'void proc_yield(void);':
    effects:
      - 持进程锁将RUNNING改为RUNNABLE并调用proc_sched。
    post:
      - 再次被调度时解锁继续；无当前进程时直接返回。
  'void proc_sched(void);':
    pre:
      - 仅持有当前进程锁，noff为1、SIE关闭、状态不为RUNNING。
    effects:
      - 保存进程上下文切回本hart scheduler；保留执行流原intena并在迁移后恢复到当前CPU。
    post:
      - 再次运行时仍持进程锁，不使用旧hart的CPU对象。
  'void proc_scheduler(void) __attribute__((noreturn));':
    pre:
      - 每个有效hart独立调用，局部trap环境已就绪。
    effects:
      - 循环在锁内选择RUNNABLE，设RUNNING及cpu.proc，swtch后撤下cpu.proc并释放交接锁。
    post:
      - 永久运行；一个进程不会并发在两个hart执行。
  'swtch':
    pre:
      - 源目标上下文有效，进程状态及锁交接满足调用约定。
    effects:
      - 保存ra、sp、s0至s11，再恢复目标相同布局。
    post:
      - 在目标ra和sp继续，不恢复tp以保持实际hart身份。
  'void proc_sleep(void *sleep_space, spinlock_t *lock);':
    pre:
      - 当前为可睡眠进程且持有条件锁；条件锁不是进程锁。
    effects:
      - 先取得进程锁再释放条件锁，记录通道并进入SLEEPING，调度；醒后清通道、解进程锁并重新取得条件锁。
    post:
      - 返回时条件锁仍由当前执行流持有，无检查到睡眠的丢失唤醒。
  'void proc_wakeup(void *sleep_space);':
    pre:
      - 调用者按条件资源的锁保护条件。
    effects:
      - 逐槽加锁把匹配通道的SLEEPING改为RUNNABLE，跳过当前进程。
    post:
      - 唤醒所有匹配等待者，不保证立即获得资源。
  'void proc_try_wakeup(proc_t *p);':
    pre:
      - 持wait_lock且未持目标进程锁。
    effects:
      - 对父进程自身通道执行受进程锁保护的条件唤醒。
    post:
      - 若父进程正在等待则变为RUNNABLE。
  'void proc_reparent(proc_t *parent);':
    pre:
      - 持wait_lock。
    effects:
      - 把退出进程所有子进程的parent改为proczero，唤醒收养者。
    post:
      - 孤儿有稳定父指针，死亡proczero仍保留至重启。
  'void proc_exit(int exit_code) __attribute__((noreturn));':
    pre:
      - 当前进程RUNNING且未持锁。
    effects:
      - 持wait_lock过继子进程并唤醒父；再持进程锁写退出码和ZOMBIE，释放wait_lock后永久调度离开。
    post:
      - 不释放正在使用的栈；proczero退出同样保留ZOMBIE且不panic。
  'int proc_wait(uint64 user_addr);':
    pre:
      - 当前进程RUNNING。
    effects:
      - 持wait_lock扫描子进程；ZOMBIE退出码先copyout再释放资源；无ZOMBIE则以自身为通道原子睡眠。
    post:
      - 成功返回子pid；无子或非法地址-1；copyout失败保留子进程供重试。
