module: toolchain
owns: [Makefile, common.mk, kernel.ld, user.ld]
state:
  default_platform: qemu
  artifacts: 默认target/qemu；vf2为target/vf2；单核为target/qemu/hart1；TEST和SELFTEST有独立子目录。
rules:
  - 构建、QEMU和GDB只在课程VMware Ubuntu中执行，使用riscv64-linux-gnu-GCC/binutils及-Wall -Werror。
  - 平台只接受qemu或vf2，QEMU只接受1或2核，默认2；VF2使用硬件物理hart1至4。
  - 用户main从0x1000开始且镜像不超过4096字节；用户代码禁用small-data；内嵌头文件由当前平台镜像生成。
  - 两平台均有ELF；VF2额外生成标准64字节RISC-V Image头的bin，入口0x40200000，text_offset为0x200000。
  - Image有效长度包含BSS占用，分配池不进入文件；首次入口清BSS、次级入口不清BSS。
  - trampoline对齐至4096且不超过一页；默认make目标为build，依赖文件不能改变默认目标。
targets:
  build:
    effects: [生成用户ELF、bin及头文件，再编译链接内核；VF2额外生成bin。]
    post: [编译或链接失败返回非零；对象、依赖和生成头文件按平台与测试隔离。]
  run:
    effects: [QEMU先构建再使用virt、130MiB、-bios default和所选核数启动；VF2拒绝执行并提示U-Boot booti。]
  debug:
    effects: [QEMU构建正确镜像并生成含当前ELF路径与GDB端口的.gdbinit，启动停止状态QEMU；VF2拒绝执行。]
  clean:
    effects: [仅移除仓库内target构建产物。]
