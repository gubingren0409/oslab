module: kernel/boot
owns: [src/kernel/boot/entry.S, src/kernel/boot/start.c, src/kernel/main.c]
state:
  CPU_stack: 按物理hart ID索引的独立4096字节早期栈，整体16字节对齐。
  boot_hartid: 初次入口清BSS后写入的启动物理hart ID。
  init_state: CAS状态0/1/2，共享初始化完整成功后以屏障发布2。
rules:
  - _entry只允许固件选择的启动hart进入，清BSS；HSM使用_entry_secondary，不再次清BSS。
  - 访问栈前检查FIRST_HART至NCPU范围；start设置tp、bare satp并进入main，始终S-mode。
  - 共享初始化完成前不启动辅助hart；SBI HSM错误不得静默降级。
  - main共享初始化依次建立print、pmem、mmap池、内核页表、进程表和全局trap。
  - 每hart安装页表、本地PLIC、stvec和timer，只有启动hart启用UART RX并创建首进程。
  - 所有有效hart最终运行scheduler，只有初始化完成的RUNNABLE进程可调度。
