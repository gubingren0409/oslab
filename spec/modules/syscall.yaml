module: kernel/syscall
owns:
  - src/kernel/syscall/syscall.c
  - src/kernel/syscall/sysfunc.c
state:
  syscall_table: 本阶段编号1至10依次为brk、mmap、munmap、print_str、print_int、getpid、fork、wait、exit、sleep；内核与用户共享同一编号头文件。
rules:
  - a7为64位调用号，a0至a5为参数，a0为返回值；仅usertrap推进PC一次4字节。
  - 分发表检查完整64位编号；未知号返回-1；所有用户指针经uvm访问。
  - 长度先检查64位值再缩窄；mmap失败0，其他可失败调用返回-1。
  - exit不返回；wait的非法退出码地址失败不得回收子进程。
functions:
  'void syscall(void);':
    pre:
      - 当前进程和trapframe有效。
    effects:
      - 有界查表，执行服务并写回a0。
    post:
      - 未知号-1；不改变用户PC。
  'uint64 arg_raw(int n);':
    pre:
      - n在0至5。
    effects:
      - 读取trapframe对应a寄存器原值。
    post:
      - 返回64位值，不访问用户内存。
  'void arg_uint32(int n, uint32 *value);':
    pre:
      - n有效且输出可写，调用方已校验高位。
    effects:
      - 写出参数低32位。
    post:
      - 不修改用户内存。
  'void arg_uint64(int n, uint64 *value);':
    pre:
      - n有效且输出可写。
    effects:
      - 写出完整参数。
    post:
      - 不修改trapframe。
  'int arg_str(int n, char *buf, int maxlen);':
    pre:
      - 内核缓冲区足够大。
    effects:
      - 最多maxlen字节受权限检查复制用户字符串。
    post:
      - 界内NUL成功0，否则-1，失败允许前缀。
  'uint64 sys_brk(void);':
    effects:
      - 校验堆顶及差值，调用堆伸缩，成功后才更新heap_top。
    post:
      - 查询或成功返回堆顶，失败-1。
  'uint64 sys_mmap(void);':
    effects:
      - 完整校验64位起点、长度并创建RWU匿名映射。
    post:
      - 返回实际起点或0，不截断高位参数。
  'uint64 sys_munmap(void);':
    effects:
      - 完整校验参数并事务解除完整覆盖的范围。
    post:
      - 成功0或失败-1；含空洞不改原链。
  'uint64 sys_print_str(void);':
    effects:
      - 有界复制用户字符串，确认NUL后以普通文本打印。
    post:
      - 成功0，非法用户地址或超长返回-1。
  'uint64 sys_print_int(void);':
    effects:
      - 把参数的低32位按有符号整数打印。
    post:
      - 返回0。
  'uint64 sys_getpid(void);':
    effects:
      - 读取当前进程pid。
    post:
      - 首进程返回1。
  'uint64 sys_fork(void);':
    effects:
      - 调用proc_fork独立复制当前地址空间。
    post:
      - 父返回子pid，子a0为0，失败父返回-1。
  'uint64 sys_wait(void);':
    effects:
      - 按用户退出码地址调用proc_wait。
    post:
      - 成功返回子pid；无子或非法地址-1；地址非法保留同一ZOMBIE。
  'uint64 sys_exit(void);':
    effects:
      - 把低32位作为退出码交给proc_exit。
    post:
      - 不返回，不释放活动内核栈；进程进入ZOMBIE。
  'uint64 sys_sleep(void);':
    effects:
      - 读取完整64位ntick并调用timer_wait。
    post:
      - 共享tick增量至少ntick后返回0。
